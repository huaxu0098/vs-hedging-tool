<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VS × Hype 多品种动态对冲匹配器 · 只读版</title>
    <link rel="stylesheet" href="/hedge.css" />
    <script type="importmap">
      { "imports": { "decimal.js": "/vendor/decimal.mjs" } }
    </script>
    <script type="module" src="/src/hedge/ui.js"></script>
  </head>
  <body>
    <header>
      <div class="brand">VS <em>×</em> Hype</div>
      <nav aria-label="工作区">
        <a href="#desk">动态匹配</a><a href="#ledger">双账本</a><a href="#replay">行情回放</a
        ><a href="#feeds">只读接入</a>
      </nav>
      <span class="readonly">本地只读</span>
    </header>
    <main>
      <section id="desk">
        <div class="heading">
          <div>
            <h1>多品种动态对冲匹配器</h1>
            <p id="context"></p>
          </div>
          <label
            >计算模式<select id="mode">
              <option value="demo">离线模拟</option>
              <option value="manual">手动快照</option>
              <option value="live_readonly">实时只读</option>
              <option value="replay">回放</option>
            </select></label
          >
        </div>
        <div id="errors" role="alert"></div>
        <div class="split">
          <section class="card">
            <h2>账户与约束</h2>
            <div class="form">
              <label>模拟标的<select id="asset"></select></label
              ><label
                >阶段<select id="stage">
                  <option value="challenge">考核试算</option>
                  <option value="funded">Funded 试算</option>
                </select></label
              >
              <label>PF 当前标记权益（U）<input id="equity" inputmode="decimal" /></label
              ><label>Hype 当前权益（U）<input id="hl" inputmode="decimal" /></label
              ><label>外部已到账（U）<input id="external" inputmode="decimal" /></label
              ><label>Hype 最低留存（U）<input id="reserve" inputmode="decimal" value="100" /></label
              ><label>提款参考净值（U）<input id="target" inputmode="decimal" value="10100" /></label
              ><label
                >仓位模式<select id="sizing">
                  <option value="auto">联合搜索</option>
                  <option value="fixedPF">固定 PF 调 Hype</option>
                  <option value="fixedHL">固定 Hype 调 PF</option>
                </select></label
              >
            </div>
            <details>
              <summary>仓位、费用与规则</summary>
              <div class="form">
                <label>PF 名义仓位（U）<input id="pf-size" value="10000" /></label
                ><label>Hype 固定名义额（U）<input id="hl-size" value="1500" /></label
                ><label>PF 搜索集合（U，逗号分隔）<input id="sizes" value="5000,10000,15000" /></label
                ><label>Funded 多参考点（选填）<input id="targets" /></label
                ><label>本轮最低增益 g（U）<input id="gain" value="0" /></label
                ><label>预算压力 k（U）<input id="friction" value="0" /></label
                ><label
                  >计算模型<select id="model">
                    <option value="exact">逐笔成交与合法仓位</option>
                    <option value="budget">连续比例与压力预算</option>
                  </select></label
                ><label
                  >方向<select id="direction">
                    <option value="both">两个方向</option>
                    <option value="1">PF 多 / Hype 空</option>
                    <option value="-1">PF 空 / Hype 多</option>
                  </select></label
                ><label
                  >排序<select id="sort">
                    <option value="gain">成功端增益最高</option>
                    <option value="worst">较差终点现金最多</option>
                    <option value="margin">保证金较低</option>
                    <option value="buffer">维持保证金余量较大</option>
                  </select></label
                ><label
                  >通过口径<select id="pass-trigger">
                    <option value="net_settlement">净结算权益</option>
                    <option value="mark_equity">标记权益</option>
                  </select></label
                ><label
                  >失败口径<select id="failure-trigger">
                    <option value="net_settlement">净结算权益</option>
                    <option value="mark_equity">标记权益</option>
                  </select></label
                >
              </div>
              <label><input id="stress-enable" type="checkbox" /> 启用额外路径压力测试</label>
              <div class="form">
                <label>跳空（bp）<input id="jump-bps" value="10" /></label
                ><label>基差扩大（bp）<input id="basis-bps" value="10" /></label
                ><label>延迟成交偏移（bp）<input id="delay-bps" value="10" /></label
                ><label>未来资金费支出（U）<input id="funding-debit" value="1" /></label>
              </div>
              <label>本地规则配置（JSON）<textarea id="profile" rows="4"></textarea></label
              ><button id="save-profile">应用规则新版本</button>
              <label>线性合约规格（JSON，可另填标的 ID）<textarea id="spec" rows="4"></textarea></label
              ><button id="save-spec">保存模拟合约</button>
            </details>
          </section>
          <section class="card result">
            <div class="cap">
              <h2>对冲比例与现金结果</h2>
              <span id="calc-status" role="status"></span>
            </div>
            <div class="hero">
              <div><small>预算比例交集</small><strong id="bounds">计算中</strong></div>
              <div><small>当前候选实际比例</small><strong id="actual">计算中</strong></div>
            </div>
            <p id="limits"></p>
            <div id="legs"></div>
            <div id="outcomes"></div>
            <p id="deadline-result"></p>
            <p id="risk"></p>
            <details>
              <summary>约束、淘汰原因及两个方案对比</summary>
              <label>对比候选<select id="compare"></select></label>
              <div id="comparison"></div>
              <div id="rejections"></div>
              <div id="stress"></div>
            </details>
          </section>
        </div>
      </section>
      <section id="ledger" class="card">
        <div class="cap">
          <h2>双账本与阶段结算</h2>
          <span id="book-state"></span>
        </div>
        <div id="accounts"></div>
        <p id="clock"></p>
        <div class="buttons">
          <button id="demo-stage">载入阶段演示副本</button><button id="adopt">确认试算余额到本地账本</button
          ><button id="simulate" class="primary">按候选模拟差额成交</button
          ><button id="close">模拟平仓</button><button id="settle">核对触线 / 到期按当前报价退出</button
          ><button id="claim">模拟全额利润分配</button><button id="receive">模拟到账</button
          ><select id="destination" aria-label="到账位置">
            <option value="external">到账外部账户</option>
            <option value="hl">到账 Hype</option></select
          ><button id="transfer-out">模拟从外部转出分成</button
          ><button id="transfer-in">模拟转入 Hype 到账</button><button id="new-round">建立下一轮基准</button>
        </div>
        <details>
          <summary>截止设置、流水与本地备份</summary>
          <label
            >新考核明确截止（UTC ISO，可空）<input id="deadline" placeholder="默认开始后 48 小时" /></label
          ><button id="rebuy">模拟重新购买考核</button><button id="save-json">导出当前备份 JSON</button
          ><button id="save-csv">导出账本 CSV</button
          ><label>恢复本地备份<input id="restore" type="file" accept=".json" /></label>
          <p>
            <a href="/fixtures/hedge-ledger.csv" download>流水样例</a> ·
            <a href="/fixtures/hedge-ledger.json" download>备份样例</a> ·
            <a href="/config/hedge-example.json" download>规则与合约配置样例</a>
          </p>
          <div id="history"></div>
          <div id="curves"></div>
        </details>
      </section>
      <section class="card" id="replay">
        <h2>行情回放</h2>
        <div class="buttons">
          <label>离线路径<select id="scenario"></select></label><button id="load-path">载入回放</button
          ><button id="step">单步</button><button id="play">播放</button><button id="pause">暂停</button
          ><label>按所选场景与首根开盘价导入 CSV<input id="csv" type="file" accept=".csv" /></label>
        </div>
        <label>回放位置<input type="range" min="0" max="0" value="0" id="seek" /></label
        ><output id="replay-result"></output
        ><a download href="/fixtures/hedge-candles.csv">下载多品种 K 线样例</a>
      </section>
      <section class="card" id="feeds">
        <h2>只读数据接入</h2>
        <div class="split">
          <div>
            <h3>Vest 手动快照</h3>
            <label
              >报价与余额币种<select id="currency">
                <option>USD</option>
                <option>USDC</option>
                <option>USDT</option>
                <option>EUR</option>
                <option>U</option>
              </select></label
            ><label>页面文字或结构化 JSON<textarea id="vs-text" rows="4"></textarea></label
            ><button id="parse">解析并预览</button><button id="confirm-vs" disabled>确认 VS 快照</button
            ><output id="vs-preview"></output>
          </div>
          <div>
            <h3>Hyperliquid 主网</h3>
            <label>完整合约代码<input id="symbol" placeholder="例如 BTC 或 dex:合约" /></label
            ><label>公开钱包地址（选填）<input id="wallet" autocomplete="off" placeholder="0x…" /></label>
            <div class="buttons">
              <button id="live">只读查询</button><button id="stream">订阅 WS</button
              ><button id="disconnect">断开</button>
            </div>
            <div class="form">
              <label>报价过期（秒）<input id="quote-age" value="5" /></label
              ><label>账户过期（秒）<input id="account-age" value="30" /></label>
            </div>
            <details>
              <summary>真实账户预算口径</summary>
              <label
                >本轮已确认输入（JSON，referenceEvent 为基准事件）<textarea
                  id="live-context"
                  rows="5"
                  placeholder='{"stage":"funded","vsAccountId":"与VS快照accountId一致","vsSymbol":"VS代码","hlSymbol":"完整Hype代码","vsCurrency":"报价币种","referenceEvent":"本轮事件ID","ref":"实际值","external":"实际值","inTransit":"实际值","vsFx":"实际汇率","hlFx":"实际汇率","token":"实际币种","fxAsOf":"带时区时间","fxUntil":"有效期","challengeDeadlineAt":"考核截止"}'
                ></textarea></label
              ><button id="confirm-live">确认本轮参考基准</button>
            </details>
            <p id="connection"></p>
            <output id="api-result"></output>
          </div>
        </div>
      </section>
    </main>
    <footer>VS × Hype · 本地模拟与只读账户观察</footer>
  </body>
</html>
