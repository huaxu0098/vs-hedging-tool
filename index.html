<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#174535" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/editor.css" />
    <meta name="vs-hype-app" content="vs-hype-matcher" />
    <title>VS × Hype 多品种动态对冲匹配器</title>
  </head>
  <body>
    <header class="appbar">
      <div class="wrap header-content">
        <a href="#desk" class="brand"
          ><span aria-hidden="true" class="brandmark">∕∕</span> VS <i>×</i> Hype</a
        >
        <nav aria-label="工作区">
          <a href="#desk">决策工作台</a><a href="#feeds">行情接入</a><a href="#sim">账本与回放</a>
        </nav>
        <span class="mode-flag">模拟推演与决策辅助（非实盘自动下单）</span>
      </div>
    </header>

    <main class="wrap">
      <div id="notice" role="status" hidden></div>
      <div class="title-row">
        <div>
          <h1>双平台仓位匹配工作台</h1>
          <p id="state-label" class="sub"></p>
        </div>
        <div class="actions">
          <button id="account-edit">账户与规则</button><button id="contract-edit">合约规格</button>
        </div>
      </div>
      <div class="asset-strip">
        <label for="asset">选择品种</label
        ><select id="asset"></select
        ><button id="asset-new" class="link">＋ 新增自定义品种</button> <span class="spacer"></span
        ><button id="refresh-demo">重放模拟报价</button
        ><select id="feed-switch" aria-label="行情来源">
          <option value="live">Hype API 实时</option>
          <option value="frozen">冻结实时快照</option>
          <option value="offline">离线模拟</option></select
        ><button id="auto-open">自动识别 VS</button><button id="paste-open">粘贴识别 VS 页面</button>
      </div>
      <section id="desk">
        <div class="toolbar">
          <div class="segments" aria-label="仓位计算模式">
            <button data-mode="auto">自动最优匹配</button><button data-mode="fixedVs">固定 VS 调 Hype</button
            ><button data-mode="fixedHype">固定 Hype 调 VS</button>
          </div>
          <label
            >方向
            <select id="direction">
              <option value="both">搜索双向</option>
              <option value="long">VS 多 / Hype 空</option>
              <option value="short">VS 空 / Hype 多</option>
            </select></label
          >
          <label
            >排序
            <select id="sort">
              <option value="worst">最差情景最优</option>
              <option value="success">达标剩余现金</option>
              <option value="buffer">强平缓冲</option>
              <option value="margin">较低保证金</option>
            </select></label
          >
        </div>
        <div class="ticket" id="ticket">
          <div>
            <label for="vs-size">VS 目标仓位（USD）</label
            ><input id="vs-size" type="number" min="0" step="any" value="10000" /><input
              type="range"
              id="vs-slider"
              min="0"
              step="1"
              aria-label="拖动 VS 仓位"
            />
          </div>
          <div>
            <label for="hype-size">Hype 目标仓位（USD）</label
            ><input id="hype-size" type="number" min="0" step="any" value="1800" /><input
              type="range"
              id="hype-slider"
              min="0"
              step="1"
              aria-label="拖动 Hype 仓位"
            />
          </div>
          <button id="solve">求解另一边</button>
        </div>
        <section id="verdict" class="verdict" data-state="pending" aria-labelledby="verdict-title">
          <header>
            <h2 id="verdict-title" aria-live="polite" aria-atomic="true">正在验算</h2>
            <strong
              ><span id="verdict-plan"></span><span id="verdict-vs"></span><span id="verdict-hype"></span
            ></strong>
          </header>
          <p>
            <span id="verdict-vs-change"></span>
            <span id="verdict-hype-change"></span>
            <span id="verdict-reason"></span>
          </p>
        </section>
        <div class="panorama">
          <section class="panel venue" id="vs-panel"></section>
          <section class="panel cross" id="cross-panel"></section>
          <section class="panel venue" id="hype-panel"></section>
        </div>
        <div class="analytics">
          <section class="panel" id="axis-panel">
            <div class="panel-head">
              <h2>双平台价格情景</h2>
              <span id="axis-unit" class="muted"></span>
            </div>
            <div id="axis"></div>
            <div class="scenario-controls" id="scenario-buttons">
              <button data-scenario="passState">到通过 / 出金线</button
              ><button data-scenario="failState">到失败线</button
              ><button data-scenario="closeState">日内收盘</button>
            </div>
            <div id="scenario-result"></div>
          </section>
          <section class="panel">
            <div class="panel-head">
              <h2>资金与风控验算</h2>
              <button id="pin" class="link">固定此方案对比</button>
            </div>
            <div id="checks"></div>
          </section>
        </div>
        <section class="panel broad">
          <div class="panel-head">
            <h2>候选与淘汰原因</h2>
            <span id="candidates-note" class="muted"></span>
          </div>
          <div id="candidates"></div>
        </section>
        <section class="panel broad">
          <div class="panel-head">
            <h2>方案对比</h2>
            <button class="link" id="clear-pin">清除对比</button>
          </div>
          <div id="comparison"></div>
        </section>
        <details class="panel broad">
          <summary>出金目标对比与计算假设</summary>
          <div id="assumptions"></div>
        </details>
      </section>
      <section id="feeds" hidden><div id="feed-root"></div></section>
      <section id="sim" hidden>
        <div class="sim-account-bar"><button id="follow-simulation">看板跟随本地模拟账本</button></div>
        <div id="sim-root"></div>
        <details class="panel broad">
          <summary>品种与规则备份</summary>
          <div class="backup-controls">
            <button id="export-settings">导出品种与规则</button
            ><label
              >恢复品种与规则 <input id="import-settings" type="file" accept="application/json,.json"
            /></label>
          </div>
        </details>
        <details class="panel broad" id="legacy">
          <summary>旧版资金占用记录</summary>
          <div id="legacy-entries"></div>
        </details>
      </section>
      <footer>VS × Hype 多品种动态对冲匹配器 · 本地只读行情与虚拟账本</footer>
      <noscript>请启用 JavaScript 运行本地工作台。</noscript>
    </main>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
